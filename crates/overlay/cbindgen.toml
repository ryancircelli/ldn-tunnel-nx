# include/ldn_tunnel_overlay.h: `make overlay-header` regenerates it, CI fails when it is stale.
language = "C"
include_guard = "LDN_TUNNEL_OVERLAY_H"
cpp_compat = true
usize_is_size_t = true
header = """/* SPDX-License-Identifier: GPL-2.0-or-later */
/* The Rust half of the overlay (crates/overlay), called by the C++ screens. */"""
autogen_warning = "/* Generated by cbindgen from crates/overlay/src: do not edit; run `make overlay-header`. */"
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
documentation_style = "c99"

[parse]
parse_deps = false

[enum]
prefix_with_name = true

[export]
item_types = ["functions", "enums", "structs", "constants"]
# newlib's own prototypes come from <stdio.h>; the rest is Rust-internal.
exclude = ["fopen", "fgets", "fclose", "RC_NOT_OPEN"]
