[package]
name = "ldn-tunnel-release"
description = "Host-side release signing tool: gen-key, sign-manifest, release-json, verify (docs/CONTRACTS.md, Release bundle)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ldn-tunnel-core = { path = "../../crates/core" }
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8", "std"] }
serde_json = "1"
sha2 = "0.11"
zerocopy = "0.8"

[lints]
workspace = true
