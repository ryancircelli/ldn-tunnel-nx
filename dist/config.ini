; ldn-tunnel config. Contains your secret relay token: never share or post this file.
; Lines starting with ; or # are comments. Saving settings from the overlay rewrites
; this file. Related files live in sdmc:/config/ldn-tunnel/:
; gamelist.txt (games routed through the relay), ca.pem (relay certificate roots).

[server]
; Your relay's address (your Cloudflare Worker). Empty = never connect.
host = <your-relay>.workers.dev
; Relay port (443 = encrypted web traffic).
port = 443
; Address on the relay that Switches connect to: wss://<host><path>.
path = /ldn
; Secret per-console token: 64 hex characters, issued by your relay.
token = 
; Certificates used to check that the relay is really yours before the token is sent.
ca_file = sdmc:/config/ldn-tunnel/ca.pem

[ldn]
; 1 = games' Local Wireless goes through the relay; 0 = real Local Wireless only.
enabled = 1
; Button(s) held while launching a game to use real Local Wireless for that game.
; Names: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK DLEFT DUP DRIGHT DDOWN;
; combine with +, e.g. ZL+ZR; or none. Avoid L and R (Atmosphere reads them at launch).
real_wireless_button = ZR

[debug]
; 1 = write a log to sdmc:/config/ldn-tunnel/ldn-tunnel.log.
enabled = 0
; 0 errors, 1 warnings, 2 normal activity, 3 everything.
level = 1
; 1 = also send log lines to the relay (for testing).
remote_log = 0

[update]
; Releases this Switch installs by itself: stable, test or off.
channel = stable

[notifications]
; Short messages shown by Ultrahand while a game runs (1 = on, 0 = off).
; Update ready / updated.
updates = 1
; Online play on or off when a game starts local wireless.
game_start = 1
; Connected / connection lost / reconnected during a game.
connection = 1
